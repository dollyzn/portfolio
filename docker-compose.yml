# Projeto isolado — não colide com o stack antigo em /home/chatwoot/nsantos
name: portfolio

services:
  web:
    image: ghcr.io/dollyzn/portfolio:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # host 3003 → container 3000; nginx do host faz o HTTPS
    ports:
      - "127.0.0.1:${APP_PORT:-3003}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://nsantos.dev}
    healthcheck:
      # dentro do container a app escuta em 3000
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
