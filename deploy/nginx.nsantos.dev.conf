# Snippet para nginx do host (ex.: Chatwoot no mesmo VPS).
# Ajuste o certificado e copie para /etc/nginx/sites-available/nsantos.dev
#
#   sudo ln -s /etc/nginx/sites-available/nsantos.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Se o TLS for gerenciado pelo Certbot:
#   sudo certbot --nginx -d nsantos.dev -d www.nsantos.dev

upstream portfolio_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name nsantos.dev www.nsantos.dev;

    # Certbot / ACME (descomente se o certbot usar webroot)
    # location /.well-known/acme-challenge/ {
    #     root /var/www/html;
    # }

    return 301 https://nsantos.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nsantos.dev;

    # ssl_certificate     /etc/letsencrypt/live/nsantos.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nsantos.dev/privkey.pem;

    return 301 https://nsantos.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nsantos.dev;

    # ssl_certificate     /etc/letsencrypt/live/nsantos.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nsantos.dev/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    location / {
        proxy_pass http://portfolio_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
