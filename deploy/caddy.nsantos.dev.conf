# Exemplo se o proxy do host for Caddy (não o container do compose).
# Inclua no Caddyfile principal do servidor:
#
#   import /home/chatwoot/nsantos/deploy/caddy.nsantos.dev.conf
#
# ou cole o bloco abaixo no Caddyfile do host.

nsantos.dev, www.nsantos.dev {
	encode gzip zstd

	@www host www.nsantos.dev
	redir @www https://nsantos.dev{uri} permanent

	reverse_proxy 127.0.0.1:3000

	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		X-Frame-Options "SAMEORIGIN"
		-Server
	}
}
